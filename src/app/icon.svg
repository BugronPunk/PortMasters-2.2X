<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon: the game's own anchor on the dark canvas, so it reads
       the same in a light strip and a dark one rather than needing a
       version for each. The paths are the icon set's anchor, and the two
       generated images beside this one draw the same mark in the same
       proportions (see _art/anchor.tsx). -->
  <rect width="32" height="32" rx="7" fill="#101521" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#e6b23c"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="5" r="3" />
    <path d="M12 22V8" />
    <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
  </g>
</svg>
